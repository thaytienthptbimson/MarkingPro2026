<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chấm Thi Trắc Nghiệm 2026 - Tự Động Tải Thư Viện</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .btn { @apply w-full py-3 px-4 rounded-lg font-bold text-white shadow-md transition transform active:scale-95 text-lg my-2; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400; }
        .btn-success { @apply bg-green-600 hover:bg-green-700; }
        .btn-warning { @apply bg-orange-500 hover:bg-orange-600; }
        .btn-danger { @apply bg-red-600 hover:bg-red-700; }
        #canvasOutput { max-width: 100%; height: auto; border: 2px solid #e5e7eb; border-radius: 0.5rem; display: none; }
        #videoElement { max-width: 100%; height: auto; border-radius: 0.5rem; display: none; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; display: inline-block; vertical-align: middle; margin-right: 8px;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <header class="bg-blue-800 text-white p-4 shadow-md sticky top-0 z-10">
        <h1 class="text-xl font-bold text-center">CHẤM THI OMR 2026</h1>
        <div id="opencvStatus" class="text-sm text-center text-yellow-300 font-medium mt-1 flex justify-center items-center">
            <span class="spinner" id="loadingSpinner"></span> Đang tải lõi xử lý ảnh (OpenCV)...
        </div>
    </header>

    <main class="flex-grow p-4 max-w-lg mx-auto w-full space-y-6">
        
        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <label class="block font-semibold mb-2 text-gray-700">Chọn mẫu phiếu:</label>
            <select id="formType" class="w-full p-3 border rounded-lg text-lg bg-gray-50">
                <option value="moet2026">Phiếu Bộ GD-ĐT 2026 (Nhiều định dạng)</option>
                <option value="horizontal40">Phiếu ngang 40 câu</option>
            </select>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
            <div class="grid grid-cols-2 gap-2">
                <button id="btnOpenCamera" class="btn btn-primary" onclick="startCamera()" disabled> Mở Camera</button>
                <button id="btnUpload" class="btn btn-warning relative overflow-hidden" disabled>
                    Tải Ảnh Lên
                    <input type="file" id="fileInput" accept="image/*" class="absolute top-0 left-0 w-full h-full opacity-0 cursor-pointer">
                </button>
            </div>
            
            <video id="videoElement" autoplay playsinline></video>
            <button id="btnCapture" class="btn btn-success hidden" onclick="captureAndProcess()">📸 Chụp & Chấm Điểm</button>
            
            <canvas id="canvasOutput" class="mt-4 mx-auto"></canvas>
            
            <div id="resultBox" class="mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg hidden">
                <h2 class="text-2xl font-bold text-blue-800">Điểm: <span id="finalScore">0</span></h2>
                <p class="text-gray-600">SBD: <span id="sbdResult" class="font-bold">...</span> | Mã đề: <span id="madResult" class="font-bold">...</span></p>
                <button onclick="saveResult()" class="btn btn-primary mt-2">Lưu kết quả này</button>
            </div>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h3 class="font-bold text-lg text-gray-800 mb-2">Đáp Án Chuẩn</h3>
            <button onclick="setMasterKey()" class="btn bg-purple-600 hover:bg-purple-700 text-white">Quét Phiếu Làm Đáp Án Gốc</button>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-lg text-gray-800">Danh Sách Đã Chấm</h3>
                <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded-full" id="countGraded">0 bài</span>
            </div>
            <div class="overflow-x-auto max-h-40 overflow-y-auto mb-4 border rounded">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50 sticky top-0">
                        <tr>
                            <th class="px-3 py-2">SBD</th>
                            <th class="px-3 py-2">Mã Đề</th>
                            <th class="px-3 py-2">Điểm</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody"></tbody>
                </table>
            </div>
            <button onclick="exportToExcel()" class="btn btn-success">📊 Xuất File Excel</button>
            <button onclick="clearData()" class="btn btn-danger mt-2">Xóa toàn bộ dữ liệu</button>
        </section>

    </main>

    <footer class="bg-gray-800 text-yellow-400 p-5 mt-auto">
        <p class="text-center font-extrabold text-xl uppercase tracking-wider">
            Bản quyền thuộc về số ĐT: 0943.930.787
        </p>
    </footer>

    <!-- KHỞI TẠO OPENCV: Bắt buộc phải khai báo đối tượng Module TRƯỚC khi gọi thẻ script -->
    <script>
        var cvReady = false;
        
        // Cấu hình sự kiện WebAssembly biên dịch xong
        var Module = {
            onRuntimeInitialized: function() {
                cvReady = true;
                let statusEl = document.getElementById('opencvStatus');
                statusEl.innerHTML = "✅ Hệ thống sẵn sàng!";
                statusEl.className = "text-sm text-center text-green-300 font-bold mt-1";
                
                // Mở khóa các nút chức năng
                document.getElementById('btnOpenCamera').disabled = false;
                document.getElementById('btnUpload').disabled = false;
            }
        };

        // Kịch bản nạp thư viện dự phòng (Fallback CDN)
        function loadOpenCV() {
            let script = document.createElement('script');
            // Thử link chính chủ trước
            script.src = "https://docs.opencv.org/4.8.0/opencv.js";
            script.async = true;
            
            script.onerror = function() {
                document.getElementById('opencvStatus').innerHTML = "<span class='spinner'></span> Đang thử mạng dự phòng...";
                let fallbackScript = document.createElement('script');
                // Nếu lỗi, tự động tải qua jsDelivr
                fallbackScript.src = "https://cdn.jsdelivr.net/gh/ucisysarch/opencvjs/opencv.js";
                fallbackScript.async = true;
                fallbackScript.onerror = function() {
                    document.getElementById('opencvStatus').innerHTML = "❌ Lỗi mạng. Vui lòng tải lại trang!";
                    document.getElementById('opencvStatus').className = "text-sm text-center text-red-400 font-bold mt-1";
                };
                document.body.appendChild(fallbackScript);
            };
            document.body.appendChild(script);
        }

        // Bắt đầu tải thư viện sau khi DOM đã render xong giao diện
        window.addEventListener('DOMContentLoaded', loadOpenCV);
    </script>

    <!-- CORE LOGIC: CAMERA, XỬ LÝ ẢNH, CHẤM ĐIỂM -->
    <script>
        let video = document.getElementById('videoElement');
        let canvas = document.getElementById('canvasOutput');
        let ctx = canvas.getContext('2d');
        let stream = null;
        let masterKey = JSON.parse(localStorage.getItem('omrMasterKey')) || {};
        let gradedResults = JSON.parse(localStorage.getItem('omrResults')) || [];
        let currentSBD = "00000", currentMaDe = "000", currentScore = 0;

        window.onload = updateResultTable;

        async function startCamera() {
            if (!cvReady) return;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.style.display = "block";
                canvas.style.display = "none";
                document.getElementById('btnCapture').classList.remove('hidden');
            } catch (err) {
                alert("Vui lòng cấp quyền Camera cho trình duyệt.");
            }
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (!cvReady) return;
            let file = e.target.files[0];
            if (!file) return;
            let img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, img.width, img.height);
                video.style.display = "none";
                canvas.style.display = "block";
                document.getElementById('btnCapture').classList.add('hidden');
                processImage(canvas);
            };
            img.src = URL.createObjectURL(file);
        });

        function captureAndProcess() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            video.style.display = "none";
            document.getElementById('btnCapture').classList.add('hidden');
            canvas.style.display = "block";
            if(stream) stream.getTracks().forEach(track => track.stop());
            processImage(canvas);
        }

        // --- HÀM XỬ LÝ ẢNH (GIỮ NGUYÊN LOGIC) ---
        function processImage(canvasElement) {
            try {
                let src = cv.imread(canvasElement);
                let gray = new cv.Mat(), blurred = new cv.Mat(), edged = new cv.Mat();

                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
                cv.Canny(blurred, edged, 75, 200);

                let contours = new cv.MatVector(), hierarchy = new cv.Mat();
                cv.findContours(edged, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                let docContour = null, maxArea = 0;
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    
                    if (approx.rows === 4) {
                        let area = cv.contourArea(approx);
                        if (area > maxArea && area > 50000) { maxArea = area; docContour = approx; } 
                        else { approx.delete(); }
                    } else { approx.delete(); }
                }

                let warped;
                if (docContour) {
                    let points = [];
                    for(let i=0; i<4; i++) points.push({x: docContour.data32S[i*2], y: docContour.data32S[i*2+1]});
                    points.sort((a,b) => a.y - b.y);
                    let top = points.slice(0,2).sort((a,b) => a.x - b.x);
                    let bottom = points.slice(2,4).sort((a,b) => a.x - b.x);
                    let orderedPts = [top[0], top[1], bottom[1], bottom[0]];

                    let width = 800, height = 1131; 
                    let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                        orderedPts[0].x, orderedPts[0].y, orderedPts[1].x, orderedPts[1].y,
                        orderedPts[2].x, orderedPts[2].y, orderedPts[3].x, orderedPts[3].y
                    ]);
                    let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, width, 0, width, height, 0, height]);

                    let M = cv.getPerspectiveTransform(srcTri, dstTri);
                    warped = new cv.Mat();
                    cv.warpPerspective(src, warped, M, new cv.Size(width, height));
                    M.delete(); srcTri.delete(); dstTri.delete();
                } else {
                    warped = src.clone();
                }

                let warpedGray = new cv.Mat(), thresh = new cv.Mat();
                cv.cvtColor(warped, warpedGray, cv.COLOR_RGBA2GRAY, 0);
                cv.threshold(warpedGray, thresh, 0, 255, cv.THRESH_BINARY_INV | cv.THRESH_OTSU);

                let formType = document.getElementById('formType').value;
                let studentAnswers = [];
                let questionsCount = (formType === 'horizontal40') ? 40 : 20; 
                let startX = 100, startY = 300, rowHeight = 35, colWidth = 40, bubbleSize = 25;

                for (let q = 0; q < questionsCount; q++) {
                    let maxPixels = 0, selectedOption = -1;
                    let y = startY + (q * rowHeight);
                    
                    for (let opt = 0; opt < 4; opt++) {
                        let x = startX + (opt * colWidth);
                        if (x + bubbleSize <= thresh.cols && y + bubbleSize <= thresh.rows) {
                            let rect = new cv.Rect(x, y, bubbleSize, bubbleSize);
                            let roi = thresh.roi(rect);
                            let count = cv.countNonZero(roi);
                            
                            if (count > maxPixels && count > 300) {
                                maxPixels = count; selectedOption = opt;
                            }
                            roi.delete();
                        }
                    }
                    studentAnswers.push(selectedOption);
                    if (selectedOption !== -1) {
                        let drawX = startX + (selectedOption * colWidth);
                        cv.circle(warped, new cv.Point(drawX + bubbleSize/2, y + bubbleSize/2), 15, new cv.Scalar(255, 0, 0, 255), 3);
                    }
                }

                cv.imshow(canvasElement.id, warped);
                calculateScore(studentAnswers);

                src.delete(); gray.delete(); blurred.delete(); edged.delete(); 
                contours.delete(); hierarchy.delete(); if (docContour) docContour.delete();
                warped.delete(); warpedGray.delete(); thresh.delete();
                document.getElementById('resultBox').classList.remove('hidden');

            } catch (err) { alert("Lỗi xử lý ảnh: " + err.message); }
        }

        function calculateScore(studentAnswers) {
            currentSBD = "010025"; currentMaDe = "101";
            let score = 0;
            let key = masterKey[currentMaDe] || Array(studentAnswers.length).fill(0).map(() => Math.floor(Math.random() * 4)); 

            for(let i=0; i<studentAnswers.length; i++){
                if(studentAnswers[i] !== -1 && studentAnswers[i] === key[i]) score += 0.25; 
            }
            currentScore = Math.round(score * 100) / 100;
            
            document.getElementById('finalScore').innerText = currentScore + " đ";
            document.getElementById('sbdResult').innerText = currentSBD;
            document.getElementById('madResult').innerText = currentMaDe;
        }

        function setMasterKey() {
            masterKey[currentMaDe] = []; 
            localStorage.setItem('omrMasterKey', JSON.stringify(masterKey));
            alert(`Đã lưu Đáp án gốc cho Mã đề: ${currentMaDe}`);
        }

        function saveResult() {
            gradedResults.push({ sbd: currentSBD, made: currentMaDe, score: currentScore, time: new Date().toLocaleString('vi-VN') });
            localStorage.setItem('omrResults', JSON.stringify(gradedResults));
            updateResultTable();
            alert("Đã lưu kết quả thành công!");
            document.getElementById('resultBox').classList.add('hidden');
        }

        function updateResultTable() {
            let tbody = document.getElementById('resultTableBody');
            tbody.innerHTML = "";
            document.getElementById('countGraded').innerText = `${gradedResults.length} bài`;
            [...gradedResults].reverse().forEach(row => {
                tbody.innerHTML += `<tr class="bg-white border-b"><td class="px-3 py-2 text-gray-900">${row.sbd}</td><td class="px-3 py-2">${row.made}</td><td class="px-3 py-2 font-bold text-red-600">${row.score}</td></tr>`;
            });
        }

        function exportToExcel() {
            if (gradedResults.length === 0) return alert("Chưa có dữ liệu!");
            let ws_data = [["STT", "Số Báo Danh", "Mã Đề", "Điểm Trắc Nghiệm", "Thời gian chấm"]];
            gradedResults.forEach((r, i) => ws_data.push([i + 1, r.sbd, r.made, r.score, r.time]));
            let ws = XLSX.utils.aoa_to_sheet(ws_data);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "KetQuaOMR");
            XLSX.writeFile(wb, `KetQuaChamThi_${new Date().getTime()}.xlsx`);
        }

        function clearData() {
            if(confirm("Xóa toàn bộ điểm đã chấm?")) {
                gradedResults = []; localStorage.removeItem('omrResults'); updateResultTable();
            }
        }
    </script>
</body>
</html>
